# Thin renderer: tabs, panes and sessions live in tmux (~/.tmux.conf)

[terminal.shell]
# Login shell so macOS gets Homebrew's PATH; every window attaches to the same
# session, and a plain shell is the fallback where tmux isn't installed
program = "/bin/zsh"
args = ["-lc", "command -v tmux >/dev/null && exec tmux new-session -A -s main; exec zsh"]

[window]
option_as_alt = "Both"
padding = { x = 4, y = 2 }

[keyboard]
bindings = [
  # Shift+Enter sends Alt+Enter: newline in Claude Code and in zsh
  { key = "Return", mods = "Shift", chars = "\u001b\r" },
]

# Catppuccin Mocha
