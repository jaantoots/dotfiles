# Inner TERM that every host and toolbox has, whatever the outer terminal
set -g default-terminal "tmux-256color"
# Outer terminals: truecolor, OSC 8 links, OSC 52 clipboard
set -as terminal-features ",alacritty:RGB:hyperlinks:clipboard"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:clipboard"

set -g automatic-rename-format '#{=30:pane_title}'
set -g set-titles on
set -g set-titles-string '#S: #T'

set -s escape-time 10
set -g focus-events on
set -g history-limit 65536
set -g set-clipboard on

# Mouse: click to select, drag borders to resize, wheel scrolls into copy mode,
# Shift bypasses tmux for the terminal's own selection
set -g mouse on
# Drag windows along the status bar to reorder them
bind -n MouseDrag1Status swap-window -d -t=

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Bells (e.g. Claude Code waiting for input) flag their window in the status
# bar and pass through, so the outer terminal marks itself urgent
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g allow-passthrough all

# Status bar (Catppuccin Mocha)
set -g status-style "bg=#313244,fg=#cdd6f4"
# Session name on the left, nothing on the right: the pane title already names
# the active window and the clock lives in the OS menu bar
set -g status-left "#[bg=#45475a] #S #[default] "
set -g status-left-length 30
set -g status-right ""
# Highlight and bell style replace the */-/! flags
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e"
set -g window-status-bell-style "bg=#f38ba8,fg=#1e1e2e"
set -g window-status-separator ""
